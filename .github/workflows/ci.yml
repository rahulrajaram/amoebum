name: ci

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl ripgrep build-essential util-linux

      - name: Lint implementation plan contract
        run: |
          if [ -f IMPLEMENTATION_PLAN.md ]; then
            ./bin/yarli-lint-implementation-plan.sh
          else
            echo "Skipping plan lint: IMPLEMENTATION_PLAN.md is not tracked in CI."
          fi

      - name: Commit message quality gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^!"
          fi
          ./bin/check-commit-message-quality.sh --range "${range}"

      - name: Kernel gates
        run: |
          ./ptui/bin/ensure-quicklisp.sh
          ./ptui/bin/check-systems.sh
          ./bin/tui-perf-test.sh --self-test
          ./ptui/bin/test.sh
          ./ptui/bin/build.sh
          ./ptui/bin/compliance-gate.sh
