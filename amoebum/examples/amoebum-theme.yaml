# Amoebum Theme Configuration
#
# This file defines the visual appearance of amoebum using PTUI's theme system.
# Place this file at one of the following locations:
#   - ~/.config/amoebum/theme.yaml          (global)
#   - ~/.amoebum/theme.yaml                 (user)
#   - <project-root>/.amoebum/theme.yaml    (project-specific)
#
# Or specify via CLI: amoebum --theme-yaml path/to/theme.yaml
#
# Edit this file while amoebum is running to see live theme updates
# (press 'r' in the chat UI to reload, or enable auto-reload in config).

# =============================================================================
# PALETTE
# =============================================================================
# Define color constants that can be referenced by name in roles.
# Colors can be specified as:
#   - Space-separated RGB: "R G B"  (e.g., "220 226 236")
#   - Hex format: "#RRGGBB" or "RRGGBB"  (e.g., "#dca2f7")

palette:
  # Background colors
  bg:        "16 18 24"      # Main background
  surface:   "30 36 46"      # Elevated surfaces (status bar)
  code-bg:   "36 42 54"      # Code block backgrounds
  
  # Border colors
  border:    "58 70 86"      # Borders and separators
  
  # Text colors
  text:      "220 226 236"   # Primary text
  muted:     "160 170 186"   # Secondary/muted text
  meta:      "116 124 138"   # Metadata text
  
  # Accent colors (Tokyo Night inspired)
  amber:     "224 175 104"   # Warm accent (user labels)
  blue:      "122 162 247"   # Cool accent (assistant labels)
  cyan:      "125 207 255"   # Cyan accent (tool labels)
  green:     "158 206 106"   # Success/positive
  yellow:    "240 198 116"   # Warning/caution
  rose:      "242 143 173"   # Error/danger
  red:       "220 50 47"     # Critical errors
  steel:     "109 140 189"   # Steel blue (borders)

# =============================================================================
# ROLES
# =============================================================================
# Define text styling for different UI elements.
# Each role can specify:
#   fg: <palette-name>      - Foreground color
#   bg: <palette-name>      - Background color (optional)
#   bold: true/false        - Bold text
#   dim: true/false         - Dim/faint text
#   italic: true/false      - Italic text
#   underline: true/false   - Underlined text
#   inverse: true/false     - Inverted colors
#   strike: true/false      - Strikethrough

roles:
  # Message sender labels
  user-label:
    fg: amber
    bold: true
  
  assistant-label:
    fg: blue
    bold: true
  
  tool-label:
    fg: cyan
    bold: true
  
  # Message content
  user:
    fg: text
  
  assistant:
    fg: text
  
  tool:
    fg: cyan
  
  system:
    fg: muted
  
  # Code and syntax highlighting
  heading:
    fg: blue
    bold: true
  
  inline-code:
    fg: text
    bg: code-bg
  
  code-body:
    fg: text
  
  code-fence:
    fg: border
    dim: true
  
  code-keyword:
    fg: rose
    bold: true
  
  code-string:
    fg: green
  
  code-function:
    fg: blue
  
  code-comment:
    fg: meta
    italic: true
  
  code-number:
    fg: yellow
  
  # UI chrome
  status-bar:
    fg: muted
    bg: surface
  
  prompt-border:
    fg: steel
  
  prompt:
    fg: text
  
  # Context/token usage indicators
  context-ok:
    fg: green
    bg: surface
    bold: true
  
  context-warn:
    fg: yellow
    bg: surface
    bold: true
  
  context-danger:
    fg: rose
    bg: surface
    bold: true
  
  # Tool call previews
  tool-preview-keyword:
    fg: meta
  
  tool-preview-tool:
    fg: blue
    bold: true
  
  tool-preview-status-streaming:
    fg: meta
    dim: true
  
  tool-preview-status-running:
    fg: yellow
  
  tool-preview-status-error:
    fg: rose
    bold: true
  
  tool-preview-args-label:
    fg: meta
  
  tool-preview-args:
    fg: text
  
  tool-preview-error:
    fg: rose
  
  tool-preview-error-text:
    fg: rose
    bold: true
  
  tool-preview-spinner:
    fg: blue
  
  tool-hint:
    fg: muted
    italic: true
  
  # Approval dialog
  approval-label:
    fg: meta
  
  approval-command:
    fg: cyan
  
  approval-path:
    fg: green
  
  # File tree browser
  tree-row-indent:
    fg: "64 72 86"
  
  tree-glyph-open:
    fg: meta
  
  tree-glyph-expanded:
    fg: green
    bold: true
  
  tree-glyph-collapsed:
    fg: yellow
    bold: true
  
  tree-status-empty:
    fg: border
  
  tree-directory-name:
    fg: blue
    bold: true
  
  tree-file-name:
    fg: text
  
  # Status/warning messages
  warning:
    fg: yellow
    bold: true
  
  error:
    fg: red
    bold: true
  
  meta:
    fg: meta

# =============================================================================
# LAYOUT (Optional / Future)
# =============================================================================
# Note: Layout configuration is currently limited in amoebum.
# The following is preserved for future compatibility with PTUI's layout system.

layout:
  # Default layout structure (reference only)
  # Amoebum uses a fixed three-panel layout:
  #   - history: Message scrollback (fill height)
  #   - prompt: Input area (3 lines)
  #   - status: Status bar (1 line)
  children:
    - name: history
      height: fill
      overflow-y: scroll
      scroll-follow: true
      scrollbar: auto
    - name: prompt
      height: 3
      border: single
      focusable: true
    - name: status
      height: 1

# =============================================================================
# BEHAVIOR (Optional)
# =============================================================================
# Future: UI behavior configuration

behavior:
  # Scroll behavior
  scroll:
    page-step: 10
    follow-output: true
  
  # Input behavior
  input:
    fuzzy-picker: true
    history-search: true
  
  # Notification behavior
  notifications:
    desktop: true
    sound: true
